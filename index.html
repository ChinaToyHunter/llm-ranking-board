<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="A curated, evidence-first LLM signal desk." />
    <script>
      // Stamp the saved (or OS) theme before first paint so dark visitors never see a light flash.
      // The storage key and colors mirror src/lib/theme.ts — a test keeps them in step.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('signal-desk-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var tint = document.querySelector('meta[name="theme-color"]');
        if (tint) tint.setAttribute('content', theme === 'dark' ? '#121419' : '#f5f3ee');
      })();
    </script>
